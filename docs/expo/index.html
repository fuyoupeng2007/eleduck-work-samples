<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>序场 · 会展管理原型</title><link rel="stylesheet" href="../shared.css"><link rel="stylesheet" href="expo.css"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23232323'/%3E%3Cpath d='M8 10h16M8 16h16M8 22h10' stroke='white' stroke-width='3'/%3E%3C/svg%3E"></head><body><div class="layout"><aside class="sidebar"><div class="brand">序场 XUCHANG<small>EVENT WORKSPACE</small></div><nav class="nav"><button data-view="events" class="active">活动工作台</button><button data-view="registration">报名配置</button><button data-view="attendees">报名名单</button><button data-view="checkin">现场签到</button><button data-view="booths">展位管理</button></nav><footer>演示团队<br>交互原型 · 本机保存<br><a href="../index.html">返回样品评审</a></footer></aside><main class="main"><header class="topline"><div><div class="eyebrow">CONFERENCE / EXHIBITION</div><h1 id="title">活动工作台</h1></div><div class="actions"><span class="tag">低保真交互原型</span><button class="btn" id="reset">重置样品</button><button class="btn primary" id="create">新建活动</button></div></header><div id="context"></div><div id="content"></div></main></div>
<dialog id="eventdialog"><form id="eventform"><h2>新建活动</h2><label class="field">活动名称<input name="name" required maxlength="60" placeholder="例如：2026 校园创新大会"></label><div class="twofields"><label class="field">开始日期<input name="start" type="date" required value="2026-10-24"></label><label class="field">结束日期<input name="end" type="date" required value="2026-10-25"></label></div><label class="field">举办地点<input name="location" required maxlength="80" placeholder="场馆名称及地址"></label><label class="field">报名人数上限<input name="capacity" type="number" min="1" max="100000" required value="300"></label><div class="dialogactions"><button type="button" class="btn" data-close="eventdialog">取消</button><button class="btn primary">创建草稿</button></div></form></dialog>
<dialog id="guestdialog"><form id="guestform"><h2>添加报名人员</h2><div id="guestfields"></div><div class="dialogactions"><button type="button" class="btn" data-close="guestdialog">取消</button><button class="btn primary">提交报名</button></div></form></dialog>
<dialog id="boothdialog"><form id="boothform"><h2 id="boothtitle">分配展位</h2><label class="field">参展单位<input name="company" maxlength="80" required></label><label class="field">联系人<input name="contact" maxlength="30" required></label><label class="field">联系电话<input name="phone" inputmode="tel" pattern="[0-9+ -]{6,20}" required></label><div class="dialogactions"><button type="button" class="btn" data-close="boothdialog">取消</button><button class="btn primary">保存分配</button></div></form></dialog>
<script src="../shared.js"></script><script src="app.js"></script></body></html>
