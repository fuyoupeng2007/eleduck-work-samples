<dialog id="productdialog" aria-labelledby="producttitle"><button class="close" data-close="productdialog" aria-label="Close product">×</button><div id="productdetail"></div></dialog><dialog id="bagdialog" aria-labelledby="bagtitle"><div class="dialogheading"><h2 id="bagtitle">Your bag</h2><button class="close" data-close="bagdialog" aria-label="Close bag">×</button></div><div id="bagbody"></div></dialog>
